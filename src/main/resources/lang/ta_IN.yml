  no-permission: "&cஇந்தக் கட்டளையைப் பயன்படுத்த உங்களுக்கு அனுமதி இல்லை."
  help-hint: "&dஉதவிக்கு &b/ncc help&d பயன்படுத்துங்கள்."
  unknown: "&cஅறியப்படாத கட்டளை. உதவிக்கு &b/ncc help&c பயன்படுத்துங்கள்."
  usage-create: "&bபயன்பாடு: /ncc create &e<பெயர்>"
  usage-delete: "&bபயன்பாடு: /ncc delete &e<பெயர்>"
