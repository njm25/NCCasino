  dealer-not-found: "&cடீலர் “&e{name}&c” கிடைக்கவில்லை."
  dealer-deleted: "&aடீலர் “&e{name}&a” மற்றும் தொடர்புடைய எல்லாக் கூறுகளும் நீக்கப்பட்டன."
